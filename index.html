<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club Ferrelunze | Sistema de Fidelización</title>
    <style>
        :root { --primary: #8b4513; --primary-dark: #3e2723; --bg-body: #f5f2eb; --text-dark: #2c1d11; --text-muted: #6d594b; --accent: #d97706; --danger: #b91c1c; --whatsapp: #25d366; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-dark); min-height: 100vh; padding-bottom: 40px; position: relative; }
        body::before { content: ''; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 550px; height: 550px; background-image: url('https://lunzemod-beep.github.io/logo.png'); background-repeat: no-repeat; background-position: center; background-size: contain; opacity: 0.12; pointer-events: none; z-index: 0; }
        
        @media (min-width: 1200px) {
            body { display: flex; flex-direction: column; align-items: center; }
            header { width: 100%; }
            .app-container-wrapper { display: flex; justify-content: center; align-items: flex-start; max-width: 1350px; width: 100%; margin: 24px auto; gap: 20px; padding: 0 16px; }
            main { flex: 0 0 850px; margin: 0 !important; }
            .side-ad-left, .side-ad-right { flex: 1; max-width: 230px; background: white; padding: 16px; border-radius: 16px; border: 1px solid #e2d9cd; box-shadow: 0 2px 8px rgba(62, 39, 35, 0.04); text-align: center; position: sticky; top: 24px; }
            .side-ad-img { width: 100%; height: auto; border-radius: 10px; margin-bottom: 10px; object-fit: cover; }
        }
        @media (max-width: 1199px) { .side-ad-left, .side-ad-right { display: none !important; } main { max-width: 1100px; margin: 24px auto; padding: 0 16px; } }

        header { background-color: #ffffff; border-bottom: 3px solid var(--primary); padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 6px rgba(62, 39, 35, 0.08); position: relative; z-index: 1; }
        .brand-logo { font-size: 1.3rem; font-weight: 800; color: var(--primary-dark); display: flex; align-items: center; gap: 8px; }
        .role-switch { display: flex; background: #e7dfd5; padding: 4px; border-radius: 12px; gap: 4px; }
        .role-btn { border: none; padding: 8px 16px; border-radius: 8px; font-weight: 700; font-size: 0.8rem; cursor: pointer; background: transparent; color: var(--text-muted); transition: all 0.2s; }
        .role-btn.active { background: white; color: var(--primary-dark); }
        .hidden { display: none !important; }
        .box-card { background: white; padding: 20px; border-radius: 16px; border: 1px solid #e2d9cd; margin-bottom: 24px; box-shadow: 0 2px 8px rgba(62, 39, 35, 0.04); }
        .login-card { max-width: 460px; margin: 30px auto; background: white; padding: 32px; border-radius: 20px; border: 1px solid #e2d9cd; text-align: center; }
        .input-field { width: 100%; padding: 12px; border: 1px solid #c8bba8; border-radius: 10px; margin-bottom: 12px; }
        .btn-primary { width: 100%; background-color: var(--primary); color: white; border: none; padding: 12px; border-radius: 10px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <div class="brand-logo">🛠️ Ferrelunze <span>Club</span></div>
        <div class="role-switch">
            <button class="role-btn active" id="btn-role-client" onclick="switchRole('client')">Cliente</button>
            <button class="role-btn" id="btn-role-admin" onclick="switchRole('admin')">Administrador</button>
        </div>
    </header>

    <div class="app-container-wrapper">
        <aside id="side-ad-left-container" class="side-ad-left hidden"><img id="pub-img-left" class="side-ad-img" src=""><h4 id="pub-title-left"></h4><p id="pub-text-left"></p></aside>

        <main style="width: 100%;">
            <!-- VISTAS -->
            <div id="client-login-view" class="login-card">
                <h2>Portal de Clientes</h2>
                <form onsubmit="handleClientLogin(event)">
                    <input type="text" id="client-cedula-input" required placeholder="Cédula" class="input-field">
                    <input type="password" id="client-pin-login" maxlength="4" required placeholder="PIN" class="input-field">
                    <button type="submit" id="btn-login-cliente" class="btn-primary">Ingresar</button>
                </form>
            </div>
            <!-- ... (Aquí irían el resto de tus divs de dashboard, admin, etc, tal cual los tenías antes) ... -->
        </main>

        <aside id="side-ad-right-container" class="side-ad-right hidden"><img id="pub-img-right" class="side-ad-img" src=""><h4 id="pub-title-right"></h4><p id="pub-text-right"></p></aside>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbzOHDyJoFt5VGlPOogbf-c1_4HHCFkGAVv3cWQQ_HXeSLsbwbI5WuPtwRIC05DrOq-cNA/exec';
        // ... (Tu lógica de JS anterior)
    </script>
</body>
</html>

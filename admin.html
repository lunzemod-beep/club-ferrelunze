<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración - Club de Lealtad FerreLunze</title>
  <style>
    :root {
      --primary: #004481;
      --secondary: #d9241b;
      --bg: #f4f6f8;
      --card-bg: #ffffff;
      --text: #333333;
      --gray: #666666;
      --border: #dddddd;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    h1, h2, h3 {
      color: var(--primary);
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 25px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input[type="text"],
    input[type="number"],
    select,
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 14px;
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #003366;
    }

    button.btn-secondary {
      background-color: #6c757d;
    }

    button.btn-secondary:hover {
      background-color: #5a6268;
    }

    button.btn-danger {
      background-color: var(--secondary);
    }

    button.btn-danger:hover {
      background-color: #b01b13;
    }

    /* Tabla de premios */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th, td {
      border: 1px solid var(--border);
      padding: 10px;
      text-align: left;
    }

    th {
      background-color: var(--primary);
      color: white;
    }

    .badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      color: white;
    }

    .badge-draft {
      background-color: #ffc107;
      color: #212529;
    }

    .badge-published {
      background-color: #28a745;
    }

    .actions-cell {
      display: flex;
      gap: 5px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Panel de Administración - FerreLunze</h1>

  <!-- NOVEDAD 1: REGISTRAR VENTA Y SUMAR PUNTOS CON SEPARADOR DE MILES -->
  <div class="card">
    <h2>Registrar Venta y Acumular Puntos</h2>
    <form id="formVenta">
      <div class="form-group">
        <label for="clienteId">Documento / Teléfono del Cliente:</label>
        <input type="text" id="clienteId" placeholder="Ej: 123456789" required>
      </div>

      <div class="form-group">
        <label for="montoVenta">Monto Total de Compra ($):</label>
        <!-- Usamos type="text" para permitir la visualización con puntos de miles -->
        <input type="text" id="montoVenta" placeholder="Ej: 150.000" required>
      </div>

      <button type="submit">Acumular Puntos</button>
    </form>
  </div>

  <!-- NOVEDAD 2: CREAR Y GESTIONAR PREMIOS (BORRADOR, PUBLICADO Y ORDENACIÓN) -->
  <div class="card">
    <h2>Crear / Editar Premio para el Catálogo</h2>
    <form id="formPremio">
      <input type="hidden" id="premioIndex" value="-1">
      
      <div class="form-group">
        <label for="nombrePremio">Nombre del Premio:</label>
        <input type="text" id="nombrePremio" placeholder="Ej: Taladro Percutor 1/2" required>
      </div>

      <div class="form-group">
        <label for="puntosPremio">Puntos Requeridos:</label>
        <input type="number" id="puntosPremio" placeholder="Ej: 2500" min="1" required>
      </div>

      <div class="form-group">
        <label for="estadoPremio">Estado del Producto:</label>
        <select id="estadoPremio">
          <option value="Borrador">Borrador</option>
          <option value="Publicado">Publicado</option>
        </select>
      </div>

      <button type="submit" id="btnGuardarPremio">Guardar Premio</button>
      <button type="button" class="btn-secondary" id="btnCancelarEdicion" style="display:none;" onclick="resetFormPremio()">Cancelar Edición</button>
    </form>

    <h3 style="margin-top: 30px;">Catálogo de Premios (Ordenado de Mayor a Menor Puntos)</h3>
    <table>
      <thead>
        <tr>
          <th>Premio</th>
          <th>Puntos</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tablaPremios">
        <!-- Se genera dinámicamente -->
      </tbody>
    </table>
  </div>
</div>

<script>
  // ==========================================
  // NOVEDAD 1: SEPARADOR DE MILES EN MONTO
  // ==========================================
  const inputMonto = document.getElementById('montoVenta');

  inputMonto.addEventListener('input', function(e) {
    // 1. Quitar todo lo que no sea número
    let valor = e.target.value.replace(/\D/g, '');
    
    // 2. Formatear con puntos como separadores de miles (estándar CO)
    if (valor) {
      valor = parseInt(valor, 10).toLocaleString('es-CO');
    }
    
    e.target.value = valor;
  });

  document.getElementById('formVenta').addEventListener('submit', function(e) {
    e.preventDefault();
    const cliente = document.getElementById('clienteId').value;
    // Extraer únicamente los dígitos numéricos para procesar
    const montoLimpio = parseInt(inputMonto.value.replace(/\./g, ''), 10);

    if (isNaN(montoLimpio) || montoLimpio <= 0) {
      alert('Por favor ingrese un monto válido.');
      return;
    }

    alert(`Venta registrada con éxito:\nCliente: ${cliente}\nMonto: $${inputMonto.value}`);
    // Aquí puedes invocar tu función backend / Google Apps Script pasando `montoLimpio`
    this.reset();
  });


  // ==========================================
  // NOVEDAD 2: GESTIÓN DE PREMIOS (BORRADOR/PUBLICADO Y ORDENACIÓN)
  // ==========================================
  
  // Estado inicial simulado de premios
  let premios = [
    { id: 1, nombre: 'Kit de Herramientas 50 pcs', puntos: 3500, estado: 'Publicado' },
    { id: 2, nombre: 'Pintura Vinilo Blanco Cuñete', puntos: 1200, estado: 'Borrador' },
    { id: 3, nombre: 'Esmeriladora Angular 4-1/2"', puntos: 5000, estado: 'Publicado' }
  ];

  function renderizarPremios() {
    const tbody = document.getElementById('tablaPremios');
    tbody.innerHTML = '';

    // ORDENAR DE MAYOR A MENOR SEGÚN PUNTOS
    premios.sort((a, b) => b.puntos - a.puntos);

    premios.forEach((item, index) => {
      const tr = document.createElement('tr');

      const badgeClass = item.estado === 'Publicado' ? 'badge-published' : 'badge-draft';

      tr.innerHTML = `
        <td>${item.nombre}</td>
        <td><strong>${item.puntos.toLocaleString('es-CO')} pts</strong></td>
        <td><span class="badge ${badgeClass}">${item.estado}</span></td>
        <td class="actions-cell">
          <button class="btn-secondary" onclick="cambiarEstado(${index})">
            ${item.estado === 'Publicado' ? 'Pasar a Borrador' : 'Publicar'}
          </button>
          <button class="btn-danger" onclick="eliminarPremio(${index})">Eliminar</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  document.getElementById('formPremio').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const nombre = document.getElementById('nombrePremio').value.trim();
    const puntos = parseInt(document.getElementById('puntosPremio').value, 10);
    const estado = document.getElementById('estadoPremio').value;

    if (!nombre || isNaN(puntos)) return;

    // Agregar nuevo premio
    premios.push({
      id: Date.now(),
      nombre: nombre,
      puntos: puntos,
      estado: estado
    });

    resetFormPremio();
    renderizarPremios();
  });

  function cambiarEstado(index) {
    premios[index].estado = premios[index].estado === 'Publicado' ? 'Borrador' : 'Publicado';
    renderizarPremios();
  }

  function eliminarPremio(index) {
    if (confirm(`¿Estás seguro de eliminar "${premios[index].nombre}"?`)) {
      premios.splice(index, 1);
      renderizarPremios();
    }
  }

  function resetFormPremio() {
    document.getElementById('formPremio').reset();
    document.getElementById('premioIndex').value = '-1';
  }

  // Carga inicial al abrir la página
  renderizarPremios();
</script>

</body>
</html>
